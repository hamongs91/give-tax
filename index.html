<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증여세 계산기</title>
<style>
  :root{--ink:#1a1a1a;--sub:#6b6b66;--line:#dcdcd6;--bg:#fafaf8;--card:#fff;--navy:#16305c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.6}
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px 40px}
  h1{font-size:24px;margin:0 0 4px}
  .lead{color:var(--sub);font-size:14px;margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
  label:first-child{margin-top:0}
  select,input[type=text]{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .hint{font-size:12px;color:var(--sub);margin:4px 0 0}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:400;margin:12px 0 0}
  .chk input{margin-top:5px}
  button{width:100%;margin-top:16px;padding:13px;font-size:16px;font-weight:700;color:#fff;background:var(--navy);border:0;border-radius:8px;cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td{padding:9px 4px;border-bottom:1px solid var(--line)}
  td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  tr.total td{border-bottom:0;font-weight:800;font-size:18px;color:var(--navy);padding-top:14px}
  .note{font-size:12px;color:var(--sub);margin-top:10px}
  .err{color:#b3261e;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>증여세 계산기</h1>
  <p class="lead">받은 사람이 내는 증여세를 대략 계산해 보는 간단 계산기입니다.</p>

  <div class="card">
    <label for="rel">준 사람과의 관계</label>
    <select id="rel">
      <option value="60000">배우자 (6억원)</option>
      <option value="5000" selected>부모 → 성년 자녀 (5천만원)</option>
      <option value="2000">부모 → 미성년 자녀 (2천만원)</option>
      <option value="5000b">자녀 → 부모 (5천만원)</option>
      <option value="1000">기타 친족 (1천만원)</option>
    </select>

    <label for="amt">이번에 받은 금액 (만원)</label>
    <input id="amt" type="text" inputmode="numeric" placeholder="예: 10000 (= 1억원)">

    <label for="prev">10년 안에 같은 사람들에게 이미 받은 금액 (만원)</label>
    <input id="prev" type="text" inputmode="numeric" placeholder="없으면 0">
    <p class="hint">부모는 아버지·어머니를 합쳐서 한 사람으로 봅니다.</p>

    <label for="paid">이미 낸 증여세 (만원)</label>
    <input id="paid" type="text" inputmode="numeric" placeholder="없으면 0">

    <label class="chk"><input id="marry" type="checkbox"> 혼인·출산 추가 공제 1억원 적용 (부모 → 성년 자녀, 혼인신고 전후 2년·출산 후 2년 이내)</label>
    <label class="chk"><input id="filed" type="checkbox" checked> 신고기한 안에 신고 (신고세액공제 3% 적용)</label>

    <button id="go" type="button">계산하기</button>
    <div id="err" class="err"></div>
  </div>

  <div class="card" id="result" hidden>
    <table>
      <tr><td>증여재산 합계 (이전 증여 포함)</td><td id="r1"></td></tr>
      <tr><td>증여재산공제</td><td id="r2"></td></tr>
      <tr><td>과세표준</td><td id="r3"></td></tr>
      <tr><td>적용 세율</td><td id="r4"></td></tr>
      <tr><td>산출세액</td><td id="r5"></td></tr>
      <tr><td>이미 낸 세액 차감</td><td id="r6"></td></tr>
      <tr><td>신고세액공제 (3%)</td><td id="r7"></td></tr>
      <tr class="total"><td>납부할 증여세</td><td id="r8"></td></tr>
    </table>
    <p class="note">공제와 세율은 일반적인 기준으로 계산한 참고용 금액입니다. 세대를 건너뛴 증여 할증, 부담부증여, 재산 평가 방식에 따라 실제 세액은 달라질 수 있어 신고 전에 국세청(126)이나 세무사에게 확인하세요.</p>
  </div>
</div>

<script>
(function(){
  var BRACKETS=[[10000,0.10,0],[50000,0.20,1000],[100000,0.30,6000],[300000,0.40,16000],[Infinity,0.50,46000]]; // 단위: 만원
  function num(v){v=String(v||'').replace(/[^0-9.]/g,'');return v?parseFloat(v):0}
  function fmt(n){
    n=Math.round(n);
    if(n===0)return '0원';
    var eok=Math.floor(n/10000),man=n%10000,s='';
    if(eok)s+=eok.toLocaleString('ko-KR')+'억 ';
    if(man)s+=man.toLocaleString('ko-KR')+'만';
    else s=s.trim()+'';
    return (eok&&!man?s.trim():s.trim())+'원';
  }
  function calc(o){
    var base=({'60000':60000,'5000':5000,'2000':2000,'5000b':5000,'1000':1000})[o.rel];
    var deduct=base+(o.marry&&o.rel==='5000'?10000:0);
    var total=o.amt+o.prev;
    var tax=Math.max(0,total-deduct);
    var b=BRACKETS.filter(function(x){return tax<=x[0]})[0];
    var gross=tax>0?tax*b[1]-b[2]:0;
    var after=Math.max(0,gross-o.paid);
    var credit=o.filed?after*0.03:0;
    return {total:total,deduct:deduct,tax:tax,rate:tax>0?b[1]:0,gross:gross,paid:Math.min(o.paid,gross),credit:credit,pay:after-credit};
  }
  window.__calc=calc;
  var $=function(id){return document.getElementById(id)};
  $('go').addEventListener('click',function(){
    var o={rel:$('rel').value,amt:num($('amt').value),prev:num($('prev').value),paid:num($('paid').value),marry:$('marry').checked,filed:$('filed').checked};
    if(!o.amt){$('err').textContent='이번에 받은 금액을 입력해 주세요.';$('result').hidden=true;return}
    $('err').textContent='';
    var r=calc(o);
    $('r1').textContent=fmt(r.total);
    $('r2').textContent='- '+fmt(r.deduct);
    $('r3').textContent=fmt(r.tax);
    $('r4').textContent=r.rate?Math.round(r.rate*100)+'%':'-';
    $('r5').textContent=fmt(r.gross);
    $('r6').textContent='- '+fmt(r.paid);
    $('r7').textContent='- '+fmt(r.credit);
    $('r8').textContent=fmt(r.pay);
    $('result').hidden=false;
  });
})();
</script>
</body>
</html>
